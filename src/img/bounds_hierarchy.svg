<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300"
     font-family="Arial, Helvetica, sans-serif" font-weight="bold">
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="#1f1f1f"/>
    </marker>
  </defs>
  <!-- guide lines -->
  <g stroke="#a8a8a8" stroke-width="2" stroke-dasharray="8 5">
    <line x1="90" y1="232" x2="90" y2="150"/>
    <line x1="330" y1="232" x2="330" y2="56"/>
    <line x1="430" y1="232" x2="430" y2="104"/>
    <line x1="720" y1="232" x2="720" y2="56"/>
    <line x1="860" y1="232" x2="860" y2="56"/>
  </g>

  <!-- the bounds of mean_sea_level -->
  <g stroke="#1f1f1f" stroke-width="4">
    <line x1="90" y1="166" x2="720" y2="166"/>
    <line x1="90" y1="154" x2="90" y2="178"/>
    <line x1="720" y1="154" x2="720" y2="178"/>
  </g>
  <text x="405" y="150" font-size="17" text-anchor="middle" fill="#1f1f1f">bounds of mean_sea_level</text>

  <!-- drone_corridor: fits -->
  <g stroke="#1a1ad6" stroke-width="4">
    <line x1="330" y1="118" x2="430" y2="118"/>
    <line x1="330" y1="106" x2="330" y2="130"/>
    <line x1="430" y1="106" x2="430" y2="130"/>
  </g>
  <text x="445" y="124" font-size="17" fill="#1a1ad6">drone_corridor: [0 m, 120 m] fits</text>

  <!-- the copied ceiling: does not fit -->
  <g stroke="#d10000" stroke-width="4">
    <line x1="330" y1="70" x2="860" y2="70"/>
    <line x1="330" y1="58" x2="330" y2="82"/>
    <line x1="860" y1="58" x2="860" y2="82"/>
  </g>
  <line x1="720" y1="70" x2="860" y2="70" stroke="#d10000" stroke-width="12" stroke-opacity="0.35"/>
  <text x="525" y="52" font-size="17" text-anchor="middle" fill="#d10000">copied ceiling: [0 m, 12'000 m] is rejected</text>
  <text x="790" y="100" font-size="15" text-anchor="middle" fill="#d10000">outside</text>

  <!-- axis -->
  <line x1="30" y1="232" x2="573" y2="232" stroke="#1f1f1f" stroke-width="5"/>
  <line x1="589" y1="232" x2="935" y2="232" stroke="#1f1f1f" stroke-width="5" marker-end="url(#axis-arrow)"/>
  <!-- break mark, the axis is not to scale -->
  <g stroke="#1f1f1f" stroke-width="3">
    <line x1="566" y1="246" x2="582" y2="218"/>
    <line x1="580" y1="246" x2="596" y2="218"/>
  </g>

  <text x="581" y="266" font-size="13" font-weight="normal" text-anchor="middle" fill="#5a5a5a">not to scale</text>

  <!-- ticks -->
  <g stroke="#1f1f1f" stroke-width="4">
    <line x1="90" y1="222" x2="90" y2="242"/>
    <line x1="160" y1="222" x2="160" y2="242"/>
    <line x1="330" y1="222" x2="330" y2="242"/>
    <line x1="430" y1="222" x2="430" y2="242"/>
    <line x1="720" y1="222" x2="720" y2="242"/>
    <line x1="860" y1="222" x2="860" y2="242"/>
  </g>

  <!-- origins -->
  <text x="160" y="266" font-size="18" text-anchor="middle" fill="#1f1f1f">mean_sea_level</text>
  <text x="330" y="266" font-size="18" text-anchor="middle" fill="#1a1ad6">runway</text>

  <!-- altitudes above mean sea level -->
  <g font-size="15" font-weight="normal" fill="#5a5a5a" text-anchor="middle">
    <text x="90" y="290">-500 m</text>
    <text x="160" y="290">0 m</text>
    <text x="330" y="290">1'600 m</text>
    <text x="430" y="290">1'720 m</text>
    <text x="720" y="290">12'000 m</text>
    <text x="860" y="290">13'600 m</text>
  </g>
</svg>
